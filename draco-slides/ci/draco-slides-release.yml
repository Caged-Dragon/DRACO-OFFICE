# Copy this file to <monorepo root>/.github/workflows/draco-slides-release.yml
# (the monorepo root .github folder is shared config, so it is intentionally not edited automatically).
#
# Pushing a tag such as draco-slides/v0.4.0 builds the Windows installer and attaches it to the
# GitHub release for that tag. The in-app Install button downloads that file.
name: Draco Slides release

on:
  push:
    tags:
      - "draco-slides/v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: draco-slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: draco-slides/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tag must match package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#draco-slides/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Draco Slides ${{ github.ref_name }}
          generate_release_notes: true
          files: draco-slides/release/Draco-Slides-Setup-*.exe
